[package]
name = "alloy-reth"
description = "Types and provider extensions for the reth_ Ethereum JSON-RPC namespace"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/onbjerg/alloy-reth"
repository = "https://github.com/onbjerg/alloy-reth"
exclude = ["benches/", "tests/", "testdata/", ".github/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition", "--show-type-layout"]

[dependencies]
# alloy
alloy-primitives = { version = "1", default-features = false, features = ["serde"] }
alloy-rpc-types-engine = { version = "1", default-features = false, features = ["serde"] }
alloy-eips = { version = "1", default-features = false }

# provider
alloy-network = { version = "1", default-features = false, optional = true }
alloy-provider = { version = "1", default-features = false, optional = true }
alloy-transport = { version = "1", default-features = false, optional = true }

# serde
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }

# misc
async-trait = { version = "0.1", optional = true }

[features]
default = ["std", "provider"]
std = [
    "alloy-primitives/std",
    "alloy-rpc-types-engine/std",
    "alloy-eips/std",
    "serde/std",
    "serde_json/std",
]
provider = [
    "dep:alloy-network",
    "dep:alloy-provider",
    "dep:alloy-transport",
    "dep:async-trait",
]

[lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"

[lints.rustdoc]
all = "warn"

[lints.clippy]
all = "warn"
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
